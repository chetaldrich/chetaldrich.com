<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-us" }}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    {{ with .Site.Params.description }}
    <meta name="description" content="{{ . }}">
    {{ end }}
    {{ with .Site.Params.author }}
    <meta name="author" content="{{ . }}">
    {{ end }}
    <link rel="icon" type="image/png" href="{{ "/images/favicon.svg" | relURL }}">
    <script>
        /* Resolve the season before the stylesheet paints, so autumn does
         * not flash the winter colours on the way in. Keep this list in step
         * with THEMES in js/autumn-ridge.js. Meteorological seasons: autumn
         * is September through November, winter is December through
         * February. Until spring and summer have their own scenes, they
         * use the autumn palette and daylight. */
        (function () {
            var month = new Date().getMonth();
            var season;
            if (month === 11 || month <= 1) {
                season = "winter";
            } else if (month >= 8) {
                season = "autumn";
            } else {
                season = "autumn";
            }
            var forced = new URLSearchParams(location.search).get("season");
            if (forced === "winter" || forced === "autumn") season = forced;
            document.documentElement.setAttribute("data-season", season);
        })();
    </script>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    {{ if .IsHome }}
    <script defer src="{{ "js/autumn-ridge.js" | relURL }}"></script>
    {{ end }}
</head>

<body{{ if .IsHome }} class="home"{{ end }}>
    <div class="viewport">
        {{ partial "header" . }}
        <div class="screen">
            <div class="titlebar">
                <span class="titlebar-mark" aria-hidden="true"></span>
                <span class="titlebar-name">{{ .Site.Title }}</span>
                <span class="titlebar-mark" aria-hidden="true"></span>
            </div>
            <div id="content">
                {{ block "main" . }}{{ end }}
            </div>
        </div>
    </div>
</body>

</html>
