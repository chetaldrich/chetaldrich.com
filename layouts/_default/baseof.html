<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    {{ with .Site.Params.description }}
    <meta name="description" content="{{ . }}">
    {{ end }}
    {{ with .Site.Params.author }}
    <meta name="author" content="{{ . }}">
    {{ end }}
    <link rel="icon" type="image/png" href="{{ "/images/favicon.svg" | relURL }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    {{ if .IsHome }}
    <script defer src="{{ "js/moonlit-ridge.js" | relURL }}"></script>
    {{ end }}
</head>

<body{{ if .IsHome }} class="home"{{ end }}>
    <div class="viewport">
        {{ partial "header" . }}
        <div class="screen">
            <div class="titlebar">
                <span class="titlebar-mark" aria-hidden="true"></span>
                <span class="titlebar-name">{{ .Site.Title }}</span>
                <span class="titlebar-mark" aria-hidden="true"></span>
            </div>
            <div id="content">
                {{ block "main" . }}{{ end }}
            </div>
            {{ partial "footer" . }}
        </div>
    </div>
</body>

</html>
