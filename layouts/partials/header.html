{{ if .IsHome }}
<div class="hero" id="hero">
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>
    <h1 class="visually-hidden">{{ .Title }}</h1>
</div>
{{ else }}
<div class="masthead">
    <a href="/" aria-label="Home">
        {{ partial "signature.html" }}
    </a>
</div>
{{ end }}
